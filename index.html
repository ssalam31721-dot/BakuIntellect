<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BakuIntellect</title>
  <style>
*{box-sizing:border-box}
body{margin:0;background:#101820;color:#f5f5f5;font-family:Arial,sans-serif}
button{cursor:pointer}
.app{display:flex;height:100dvh}
.sidebar{width:260px;background:#111f2b;padding:18px;display:flex;flex-direction:column;border-right:1px solid #293b49}
.brand{font-size:21px;font-weight:bold;color:#e6c36b;margin:10px 0 25px}
.new{background:#233746;color:white;border:1px solid #405464;border-radius:12px;padding:13px;text-align:left;font-size:15px}
.history{margin-top:25px;color:#9eacb8;font-size:13px}
.history button{display:block;width:100%;text-align:left;background:transparent;color:#dce3e8;border:0;padding:10px 5px;border-radius:8px}
.history button:hover{background:#263946}
.bottom{margin-top:auto;color:#8c9ba7;font-size:12px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:60px;border-bottom:1px solid #293b49;display:flex;align-items:center;padding:0 20px;gap:15px}
.menu{display:none;background:none;border:0;color:white;font-size:23px}
.topname{font-weight:bold}
.badge{margin-left:auto;color:#e6c36b;font-size:13px}
.content{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:25px 18px}
.welcome{margin:auto 0;text-align:center;max-width:600px}
.welcome h1{font-size:32px;color:#e6c36b;margin-bottom:12px}
.welcome p{color:#aebbc5;line-height:1.6}
.suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:25px}
.suggestions button{background:#1d303d;color:#dce4e9;border:1px solid #354b5b;border-radius:20px;padding:10px 13px}
#messages{width:100%;max-width:760px}
.msg{padding:13px 17px;margin:18px 0;border-radius:17px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#263b49;margin-left:auto;max-width:85%;width:fit-content}
.bot{max-width:90%;color:#f0f2f4}
.composer-area{width:100%;max-width:800px;padding:12px 18px 8px;margin:auto auto 0}
.composer{background:#202f3b;border:1px solid #40515e;border-radius:23px;padding:12px 14px}
textarea{width:100%;resize:none;max-height:130px;background:transparent;border:0;outline:0;color:white;font-size:16px;font-family:Arial}
textarea::placeholder{color:#a4b0b9}
.tools{display:flex;align-items:center;gap:12px}
.tools button{background:transparent;color:#dce4e9;border:0;font-size:21px}
.tools .send{margin-left:auto;background:#e6c36b;color:#14212b;border-radius:50%;width:39px;height:39px;font-size:22px}
.tools .send:disabled{opacity:.5;cursor:wait}
.note{text-align:center;font-size:11px;color:#82919d;padding:8px}
#file{display:none}
@media(max-width:650px){
.sidebar{display:none;position:absolute;z-index:5;height:100%;width:270px}
.sidebar.open{display:flex}
.menu{display:block}
.welcome h1{font-size:27px}
}
/* BakuIntellect — Bakı mavi dizaynı */

.app {
  background: linear-gradient(145deg, #eaf6ff, #ffffff) !important;
  color: #12304a !important;
}

.sidebar {
  background: #dff1ff !important;
  border-right: 1px solid #c5e3f8 !important;
}

.main {
  background: linear-gradient(160deg, #f5fbff, #e8f5ff) !important;
}

.top {
  background: rgba(255,255,255,0.9) !important;
  border-bottom: 1px solid #d5eafa !important;
  color: #075985 !important;
}

.composer-area {
  background: transparent !important;
}

.composer {
  background: white !important;
  border: 2px solid #b9def8 !important;
  border-radius: 22px !important;
  box-shadow: 0 8px 28px rgba(0,100,180,0.10) !important;
}

#question {
  color: #12304a !important;
}

.send {
  background: linear-gradient(135deg, #0785d1, #0755a5) !important;
  color: white !important;
  border-radius: 15px !important;
}

.menu {
  color: #0879bd !important;
}

#history {
  color: #16476a !important;
}

#messages {
  scroll-behavior: smooth;
}

#welcome {
  color: #075985 !important;
}

button {
  transition: 0.2s ease;
}

button:hover {
  filter: brightness(1.08);
}
  </style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="brand">✦ BAKUINTELLECT</div>
<button class="new" onclick="newChat()">＋ Yeni sohbet</button>
<div class="history">SOHBETLER</div>
<div id="history"></div>
<div class="bottom">🇦🇿 Bakıdan sevgi ilə<br><br>BakuIntellect</div>
</aside>

<section class="main">
<header class="top">
<button class="menu" onclick="toggleMenu()">☰</button>
<div class="topname">BakuIntellect</div>
<div class="badge">🇦🇿 Bakı</div>
</header>

<div class="content">
<div class="welcome" id="welcome">
<h1>Salam! 👋</h1>
<p>Bakından dünyaya açılan süni intellekt.</p>
<p>Bu gün sənə necə kömək edə bilərəm?</p>
<div class="suggestions">
<button onclick="suggest('Mənə Azərbaycan haqqında danış')">🇦🇿 Azərbaycan</button>
<button onclick="suggest('Mənə maraqlı bir elm faktı de')">🔬 Elm</button>
<button onclick="suggest('Mənə proqramlaşdırmanı öyrət')">💻 Proqramlaşdırma</button>
</div>
</div>
<div id="messages"></div>
</div>

<div class="composer-area">
<div class="composer">
<textarea id="question" rows="1" placeholder="BakuIntellect-ə mesaj yaz..."></textarea>
<div class="tools">
<button onclick="document.getElementById('file').click()" title="Şəkil əlavə et">＋</button>
<input id="file" type="file" accept="image/*">
<span id="fileName" style="font-size:11px;color:#aebbc5"></span>
<button class="send" id="sendButton" onclick="sendMessage()">↑</button>
</div>
</div>
<div class="note">BakuIntellect səhv edə bilər. Vacib məlumatları yoxla.</div>
</div>
</section>
</div>

<script>
let chats=JSON.parse(localStorage.getItem('baku-chats')||'[]');
let active=0;
let sending=false;

function save(){
localStorage.setItem('baku-chats',JSON.stringify(chats));
render();
}

function newChat(){
chats.unshift({title:'Yeni söhbət',messages:[]});
active=0;
save();
document.getElementById('messages').innerHTML='';
document.getElementById('welcome').style.display='block';
document.getElementById('sidebar').classList.remove('open');
}

function render(){
let h=document.getElementById('history');
h.innerHTML='';
chats.forEach((c,i)=>{
let b=document.createElement('button');
b.textContent='💬 '+c.title;
b.onclick=()=>openChat(i);
h.appendChild(b);
});
}

function openChat(i){
active=i;
let c=chats[i];
document.getElementById('messages').innerHTML='';
c.messages.forEach(m=>addBubble(m.role,m.text));
document.getElementById('welcome').style.display=c.messages.length?'none':'block';
document.getElementById('sidebar').classList.remove('open');
}

function addBubble(role,text){
let d=document.createElement('div');
d.className='msg '+role;
d.textContent=text;
document.getElementById('messages').appendChild(d);
return d;
}

function suggest(t){
document.getElementById('question').value=t;
sendMessage();
}

async function sendMessage(){
if(sending)return;

let input=document.getElementById('question');
let button=document.getElementById('sendButton');
let q=input.value.trim();
if(!q)return;

if(!chats[active]){
chats.unshift({title:'Yeni söhbət',messages:[]});
active=0;
}

let c=chats[active];
if(!c.messages.length)c.title=q.slice(0,28);

c.messages.push({role:'user',text:q});
input.value='';
document.getElementById('welcome').style.display='none';

addBubble('user',q);
let loading=addBubble('bot','BakuIntellect düşünür... 😊');

sending=true;
button.disabled=true;

try{
let messages=c.messages
.filter(m=>m!==c.messages[c.messages.length-1] || m.role==='user')
.slice(0,-1)
.map(m=>({
role:m.role==='bot'?'assistant':m.role,
content:m.text
}));

messages.push({role:'user',content:q});

let response=await fetch('/api/chat',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({messages})
});

let data=await response.json();

if(!response.ok){
throw new Error(data.error||'Server xətası baş verdi.');
}

let reply=data.reply||'Cavab alınmadı.';
loading.textContent=reply;
c.messages.push({role:'bot',text:reply});

}catch(error){
loading.textContent='Bağlantı xətası: '+error.message;
c.messages.push({role:'bot',text:'Bağlantı xətası: '+error.message});
}

sending=false;
button.disabled=false;
save();

document.querySelector('.content').scrollTop=
document.querySelector('.content').scrollHeight;
}

function toggleMenu(){
document.getElementById('sidebar').classList.toggle('open');
}

document.getElementById('file').addEventListener('change',e=>{
let f=e.target.files[0];
document.getElementById('fileName').textContent=f?f.name:'';
});

document.getElementById('question').addEventListener('keydown',e=>{
if(e.key==='Enter'&&!e.shiftKey){
e.preventDefault();
sendMessage();
}
});

if(!chats.length)chats=[{title:'Yeni söhbət',messages:[]}];
render();
openChat(0);
</script>
</body>
</html>
